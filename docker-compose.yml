version: '3.4'
services:
  root:
    build:
      context: .
      target: builder
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
      - "${CMS_PORT}:${CMS_PORT}"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - ./apps/cms/node_modules:/app/apps/cms/node_modules
      - ./apps/web/node_modules:/app/apps/web/node_modules
  mongodb:
    image: mongo:4.4.14
    ports:
      - 27017:27017
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
