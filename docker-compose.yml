version: '3.4'
services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    working_dir: /app/apps/web
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    env_file:
      - .env
  cms:
    build:
      context: .
      dockerfile: ./apps/cms/Dockerfile
    working_dir: /app/apps/cms
    ports:
      - "${CMS_PORT}:${CMS_PORT}"
    env_file:
      - .env
  mongodb:
    image: mongo:4.4.14
    ports:
      - 27017:27017
    volumes:
      - mongodata:/data/db
volumes:
  mongodata:
